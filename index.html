:root{
  --bg:#f3f0e8; --card:#fffdf8; --ink:#16302e; --ink2:#3b4f4c; --muted:#6f7a75; --line:#e3dccd; --line2:#efe9dd;
  --teal:#0f4d4a; --teal2:#176a65; --tealbg:#e2eeeb; --sand:#b8893a; --sandbg:#f5ead4;
  --red:#a63d2a; --redbg:#f7e4de; --amber:#93600f; --amberbg:#f6ecd6; --green:#2c6e45; --greenbg:#e1efe5;
  --wa:#1f8f55; --r:14px; --shadow:0 1px 2px rgba(22,48,46,.06),0 6px 20px rgba(22,48,46,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plex Ar",system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
body.veil #app{filter:blur(14px)}
/* ---------- lock ---------- */
#lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(1200px 500px at 85% -10%,#1d6a64 0,transparent 60%),linear-gradient(160deg,#0f4d4a,#0b3532)}
.lockbox{width:100%;max-width:400px;background:var(--card);border-radius:22px;padding:30px 26px 24px;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand .mark{width:46px;height:46px;border-radius:14px;background:var(--teal);display:grid;place-items:center;color:#fff}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:0}
.brand p{margin:0;color:var(--muted);font-size:13px}
.lockbox label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 6px;font-weight:600}
.field{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--teal2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:10px 16px;font-weight:600;background:var(--teal);color:#fff;transition:filter .15s,transform .05s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn.block{width:100%;padding:13px;margin-top:18px;font-size:16px}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--line)}
.btn.soft{background:var(--tealbg);color:var(--teal)}
.btn.wa{background:var(--wa)}
.btn.danger{background:var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.7}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:20px;font-weight:600}
/* ---------- shell ---------- */
#app{min-height:100%}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--teal);color:#dfeeea;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .brand h1{color:#fff;font-size:18px} .side .brand p{color:#a9cbc5}
.side .brand .mark{background:rgba(255,255,255,.12)}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#cfe4e0;padding:11px 12px;border-radius:11px;text-align:right;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:#fff;color:var(--teal);font-weight:700}
.nav .count{margin-inline-start:auto;font-size:11.5px;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:20px}
.nav button.on .count{background:var(--tealbg)}
.side .foot{margin-top:auto;font-size:12px;color:#a9cbc5;display:flex;flex-direction:column;gap:10px}
.side .foot .btn{background:rgba(255,255,255,.1)}
main{padding:26px 30px 40px;max-width:1180px;width:100%}
.top{display:none}
.bnav{display:none}
.h2{font-size:22px;font-weight:700;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
/* ---------- search ---------- */
.searchbar{position:relative}
.searchbar svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbar input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:15px 48px 15px 16px;font-size:16.5px;outline:none;box-shadow:var(--shadow)}
.searchbar input:focus{border-color:var(--teal2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:30px;padding:6px 13px;font-size:13.5px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
select.chip{padding-left:10px;outline:none}
.meta{color:var(--muted);font-size:13px;margin-bottom:10px}
.list{display:grid;gap:9px}
.row{display:flex;align-items:center;gap:13px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.row:hover{border-color:#cfc5b1}
.av{width:42px;height:42px;border-radius:13px;background:var(--tealbg);color:var(--teal);display:grid;place-items:center;font-weight:700;flex:none;font-size:17px}
.row .who{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ln{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tag.cls{background:var(--tealbg);color:var(--teal)}
.tag.red{background:var(--redbg);color:var(--red)}
.tag.amb{background:var(--amberbg);color:var(--amber)}
.tag.flag{background:var(--sandbg);color:var(--sand)}
.tag.grn{background:var(--greenbg);color:var(--green)}
.phone{white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;font-weight:600;color:var(--ink);letter-spacing:.3px}
.acts{display:flex;gap:6px;flex:none}
.ib{width:38px;height:38px;border-radius:11px;border:0;display:grid;place-items:center;background:var(--tealbg);color:var(--teal);text-decoration:none}
.ib.wa{background:#dff2e6;color:var(--wa)}
.ib:hover{filter:brightness(.96)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{color:#c4b9a3;margin-bottom:10px}
.hl{background:#fbe7a6;border-radius:3px;padding:0 1px}
.more{margin:14px auto 0;display:block}
/* ---------- stats / classes ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:700;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{padding:15px 16px}
.ccard h3{margin:0;font-size:17px;direction:ltr;text-align:right}
.ccard .lv{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.bar{height:7px;border-radius:9px;background:var(--line2);overflow:hidden;margin:4px 0 9px}
.bar i{display:block;height:100%;background:var(--teal2);border-radius:9px}
.bar.a i{background:var(--sand)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.ccard .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font-size:12.5px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl input,.tbl select{border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;outline:none;width:100%}
.tbl input:focus{border-color:var(--teal2)}
.tbl .ok{color:var(--green);font-weight:700}
.scroll{overflow-x:auto}
/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,30,28,.4);z-index:40;animation:fade .15s}
.sheet{position:fixed;top:0;bottom:0;left:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:20px 0 50px rgba(0,0,0,.18);animation:slide .2s ease-out}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(-30px);opacity:0}}
.sh-head{background:var(--teal);color:#fff;padding:18px 20px 20px;position:sticky;top:0;z-index:2}
.sh-head .x{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.12);color:#fff}
.sh-head h2{margin:0 0 4px;font-size:21px;padding-left:46px}
.sh-head .ln{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:#c9e2dd;align-items:center}
.sh-head .tag{background:rgba(255,255,255,.14);color:#fff}
.sh-body{padding:16px 16px 40px;display:grid;gap:12px}
.sec{padding:14px 15px}
.sec h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:7px;color:var(--teal)}
.sec h4 .r{margin-inline-start:auto}
.ph{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.ph:first-of-type{border-top:0;padding-top:2px}
.ph .info{flex:1;min-width:0}
.ph .rel{font-size:12.5px;color:var(--muted)}
.ph .phone{font-size:17px;display:block;text-align:right}
.star{background:none;border:0;color:#c9bfa9;padding:4px}
.star.on{color:var(--sand)}
.alert{padding:10px 12px;border-radius:11px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.alert.red{background:var(--redbg);color:var(--red)}
.alert.amb{background:var(--amberbg);color:var(--amber)}
.alert.tl{background:var(--tealbg);color:var(--teal)}
.form{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}
.form .field{padding:9px 11px;border-radius:10px}
textarea.field{resize:vertical;min-height:90px;line-height:1.7}
.adr{padding:8px 0;border-top:1px solid var(--line2);font-size:14px}
.adr:first-child{border-top:0;padding-top:0}
.adr small{color:var(--muted);display:block;font-size:11.5px}
.people{display:grid;gap:8px}
.person{display:flex;gap:10px;font-size:13.5px}
.person b{min-width:64px;color:var(--muted);font-weight:600;font-size:12.5px;padding-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.logi{border-top:1px solid var(--line2);padding:9px 0;font-size:13.5px}
.logi:first-child{border-top:0;padding-top:0}
.logi .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.logi .d{font-size:12px;color:var(--muted);margin-inline-start:auto}
.logi p{margin:3px 0 0;color:var(--ink2)}
.quick{position:sticky;top:96px;z-index:1;padding:12px 14px;background:#fff8e6;border:1.5px solid #ecd49c}
.quick .chips{margin-top:8px}
.sib{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px}
/* ---------- dialog ---------- */
.dscrim{position:fixed;inset:0;background:rgba(14,30,28,.45);z-index:60;animation:fade .15s}
.dlg{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,94vw);max-height:92vh;overflow:auto;padding:18px 18px 16px;background:var(--card)}
.dlg h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:center;color:var(--teal)}
.dlg .dsub{color:var(--muted);font-size:13px;margin-top:3px}
.dlg .l{display:block;font-size:12.5px;color:var(--ink2);font-weight:700;margin:14px 0 7px}
.dlg .acts2{display:flex;gap:8px;margin-top:18px}
.dlg .acts2 .btn{flex:1;padding:12px}
.dlg .chip{cursor:pointer}
@media (max-width:900px){.dlg{top:auto;bottom:0;transform:translateX(-50%);width:100%;border-radius:20px 20px 0 0;padding-bottom:max(16px,env(safe-area-inset-bottom));max-height:88vh}}
/* ---------- toast ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.drop{display:block;border:2px dashed #cdbf9f;border-radius:16px;padding:26px;text-align:center;background:#fbf8f1;color:var(--ink2);cursor:pointer}
.drop.over{border-color:var(--teal2);background:var(--tealbg)}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.setgrid .wide{grid-column:1/-1}
.res{font-size:13.5px;margin-top:10px;display:grid;gap:6px}
.lockhint{font-size:12px;color:var(--muted)}
.syncpill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.14);color:#e6f2ef;align-self:flex-start;white-space:nowrap}
.syncpill::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#7fd6a3;margin-inline-end:6px;vertical-align:middle}
.syncpill[data-st=busy]::before{background:#f1c96b}
.syncpill[data-st=err]::before{background:#ff8a76}
/* ---------- print ---------- */
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;font-size:13.5pt;color:#000}
  .pa-head{display:flex;justify-content:space-between;font-size:11pt;line-height:1.6;border-bottom:1.5px solid #000;padding-bottom:8px}
  .pa-title{text-align:center;font-size:17pt;font-weight:700;margin:22px 0 18px}
  .pa-body{line-height:2.1}
  .pa-sign{display:flex;justify-content:space-between;margin-top:34px;font-weight:600}
  .pa-cut{border-top:1.5px dashed #000;margin-top:40px;padding-top:12px;font-size:11.5pt;line-height:2}
  .pt{width:100%;border-collapse:collapse;font-size:10.5pt}
  .pt th,.pt td{border:1px solid #000;padding:5px 6px;text-align:right}
  .pt td.e{width:28%}
  .pbreak{page-break-after:always}
}
/* ---------- mobile ---------- */
@media (max-width:900px){
  .shell{display:block}
  .side{display:none}
  main{padding:14px 14px 96px}
  .top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--teal);color:#fff;position:sticky;top:0;z-index:20;padding-top:max(12px,env(safe-area-inset-top))}
  .top .mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center}
  .top b{font-size:16px}
  .top .ib{margin-inline-start:auto;background:rgba(255,255,255,.12);color:#fff}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{flex:1;background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
  .bnav button.on{color:var(--teal)}
  .stats{grid-template-columns:1fr 1fr}
  .setgrid{grid-template-columns:1fr}
  .h2{font-size:19px}
  .row{padding:11px 12px;gap:10px}
  .av{width:38px;height:38px}
  .sh-head{padding:14px 16px 16px}
  .quick{top:84px}
  .ph{flex-wrap:wrap}
  .ph .info{flex:1 1 60%}
  .ph .acts{margin-inline-start:auto}
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tbl.stack td{border:0;padding:0}
  .tbl.stack td.w{grid-column:1/-1}
}
</style>
</head>

function famKey(s){
  for (const c of [s.g.cin, s.f.cin, s.m.cin]) { const v = clean(c); if (v && v.length > 3) return 'c:' + v.toUpperCase(); }
  return 's:' + s.code;
}
function contacts(s){
  const map = new Map();
  const add = (raw, rel, name, src, id) => {
    for (const n of parsePhones(raw)){
      let c = map.get(n);
      if (!c){ c = {num:n, rels:[], names:[], manual:false, ids:[], valid:VALID.test(n)}; map.set(n, c); }
      if (rel && !c.rels.includes(rel)) c.rels.push(rel);
      if (name && !c.names.includes(name)) c.names.push(name);
      if (src === 'manual'){ c.manual = true; c.ids.push(id); }
    }
  };
  for (const p of s.extra.phones) add(p.num, p.rel, p.note, 'manual', p.id);
  add(s.g.tel, 'الولي', fullName(s.g), 'massar');
  add(s.f.tel, 'الأب', fullName(s.f), 'massar');
  add(s.m.tel, 'الأم', fullName(s.m), 'massar');
  return [...map.values()];
}
function primaryPhone(s){
  const cs = contacts(s).filter(c => c.valid);
  if (!cs.length) return null;
  return cs.find(c => c.num === s.primary) || cs.find(c => !c.manual && c.rels.includes('الولي')) || cs[0];
}
function addresses(s){
  const out = [], seen = new Set();
  const add = (a, lbl) => { const v = clean(a); if (!v) return; const k = norm(v); if (seen.has(k)) { const o = out.find(x => norm(x.a) === k); if (o && !o.l.includes(lbl)) o.l.push(lbl); return; } seen.add(k); out.push({a:v, l:[lbl]}); };
  add(s.extra.adr, 'عنوان محيَّن');
  add(s.g.adr, 'الولي'); add(s.f.adr, 'الأب'); add(s.m.adr, 'الأم');
  return out;
}

function derive(){
  if (D && D.ver === derivedVer) return D;
  const list = Object.values(S.students);
  const fam = new Map(), phoneFam = new Map(), idx = new Map();
  for (const s of list){
    const k = famKey(s);
    if (!fam.has(k)) fam.set(k, []); fam.get(k).push(s.code);
    const cs = contacts(s);
    for (const c of cs){ if (!phoneFam.has(c.num)) phoneFam.set(c.num, new Set()); phoneFam.get(c.num).add(k); }
    const parts = [s.nom, s.prenom, s.code, s.cls, fullName(s.g), fullName(s.f), fullName(s.m), s.g.pf, s.g.nf, s.extra.adr, s.g.adr, s.f.adr, s.m.adr, ...s.extra.phones.map(p => p.note)];
    idx.set(s.code, {t: norm(parts.join(' ')), n: norm(s.prenom + ' ' + s.nom + ' ' + s.nom + ' ' + s.prenom), p: cs.map(c => c.num).join(' '), hp: cs.some(c => c.valid), ha: addresses(s).length > 0});
  }
  const classes = Object.keys(S.classes).concat(list.map(s => s.cls)).filter(Boolean);

}

/* ================= import ================= */
function findCell(rows, re, maxRow){
  for (let r = 0; r < Math.min(rows.length, maxRow); r++) for (let c = 0; c < rows[r].length; c++){
    if (re.test(String(rows[r][c] || ''))){ for (let k = c + 1; k < rows[r].length; k++){ const v = clean(rows[r][k]); if (v) return v; } }
  }
  return '';
}
function parseWorkbook(wb, fname){
  const name = wb.SheetNames.find(n => /tuteur/i.test(n)) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:false, defval:''});
  let h = rows.findIndex(r => r.some(c => String(c).trim() === 'رقم التلميذ'));
  if (h < 0) throw new Error('لم أجد عمود «رقم التلميذ». تأكد أن الملف مصدَّر من خانة معلومات الولي في مسار.');
  const H = rows[h].map(c => String(c).trim());
  const col = (re, def) => { const i = H.findIndex(c => re.test(c)); return i < 0 ? def : i; };
  const cCode = col(/^رقم التلميذ$/, 2), cNom = col(/^النسب/, 3), cPre = col(/^الإسم|^الاسم/, 4), cTut = col(/الوصاية/, 5);
  const cG = col(/ولي الا?أ?مر/, 6), cF = col(/عن الأب/, 14), cM = col(/عن الأم/, 22);
  const cls = findCell(rows, /القسم/, h) || fname.replace(/\.[^.]+$/, '');
  const level = findCell(rows, /المستوى/, h);
  const year = findCell(rows, /السنة الدراسية/, h);
  const person = (r, c) => ({cin:clean(r[c]), pa:clean(r[c+1]), na:clean(r[c+2]), pf:clean(r[c+3]), nf:clean(r[c+4]), job:clean(r[c+5]), tel:clean(r[c+6]), adr:clean(r[c+7])});
  const recs = [];
  for (let i = h + 2; i < rows.length; i++){
    const r = rows[i]; const code = clean(r[cCode]).toUpperCase();
    if (!code || !/^[A-Z]\d{6,}$/.test(code)) continue;
    recs.push({code, nom:clean(r[cNom]), prenom:clean(r[cPre]), tut:clean(r[cTut]), g:person(r, cG), f:person(r, cF), m:person(r, cM)});
  }
  if (!recs.length) throw new Error('الملف لا يحتوي على تلاميذ.');
  return {cls, level, year, recs};
}
function applyImport(p){
  const now = Date.now(); let nw = 0, up = 0, gone = 0;
  const codes = new Set();
  for (const r of p.recs){
    codes.add(r.code);
    let s = S.students[r.code];
    if (!s){ s = newStudent(r.code); S.students[r.code] = s; nw++; } else up++;
    Object.assign(s, {nom:r.nom, prenom:r.prenom, tut:r.tut, g:r.g, f:r.f, m:r.m, cls:p.cls, level:p.level || s.level, year:p.year || s.year, missing:false, upd:now});
  }
  for (const s of Object.values(S.students)) if (s.cls === p.cls && !codes.has(s.code) && !s.missing){ s.missing = true; s.upd = now; gone++; }
  S.classes[p.cls] = {level:p.level, year:p.year, at:now, n:p.recs.length};
  return {nw, up, gone};
}
async function importFiles(files){
  const out = [];
  for (const f of files){
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const p = parseWorkbook(wb, f.name);
      const r = applyImport(p);
      out.push({ok:true, name:f.name, cls:p.cls, n:p.recs.length, ...r});
    } catch(e){ out.push({ok:false, name:f.name, err:e.message || String(e)}); }
  }
  if (out.some(o => o.ok)){ S.imports.unshift({at:Date.now(), files:out.filter(o => o.ok).map(o => o.cls)}); S.imports = S.imports.slice(0, 30); touch(); await saveNow(); }
  return out;
}

/* ================= merge (between devices / backups) ================= */
function mergeStates(a, b){
  const newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b, older = newer === a ? b : a;
  const out = JSON.parse(JSON.stringify(newer));
  for (const [code, so] of Object.entries(older.students || {})){
    const sn = out.students[code];
    if (!sn){ out.students[code] = JSON.parse(JSON.stringify(so)); continue; }
    const base = (so.upd || 0) > (sn.upd || 0) ? JSON.parse(JSON.stringify(so)) : sn;
    const other = base === sn ? so : sn;
    const del = new Set([...(base.del || []), ...(other.del || [])]);
    base.del = [...del];
    const lm = new Map();
    for (const l of [...(other.log || []), ...base.log]){ const o = lm.get(l.id); if (!o || (l.u || 0) >= (o.u || 0)) lm.set(l.id, l); }
    base.log = [...lm.values()].filter(l => !del.has(l.id));
    base.log.sort((x, y) => (y.d || '').localeCompare(x.d || ''));
    const nums = new Set(base.extra.phones.map(p => p.num));
    for (const p of other.extra.phones || []) if (!nums.has(p.num)) base.extra.phones.push(p);
    base.extra.phones = base.extra.phones.filter(p => !del.has(p.id));
    out.students[code] = base;
  }
  for (const [k, c] of Object.entries(older.classes || {})) if (!out.classes[k] || (out.classes[k].at || 0) < (c.at || 0)) out.classes[k] = c;
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return out;
}
function upgrade(st){
  st.settings = Object.assign(defaultSettings(), st.settings || {});
  st.students = st.students || {}; st.classes = st.classes || {}; st.imports = st.imports || [];
  for (const s of Object.values(st.students)){ s.extra = s.extra || {phones:[], adr:''}; s.extra.phones = s.extra.phones || []; s.flag = s.flag || {on:false, reasons:[], note:''}; s.log = s.log || []; s.del = s.del || []; for (const k of ['g','f','m']) s[k] = Object.assign(emptyPerson(), s[k] || {}); }
  return st;
}

const GH = 'https://api.github.com';
const SYNC = {busy:false, ref:null, dirty:false, last:0, status:'off', err:'', timer:null, branch:null};
function syncCfg(st){ st = st || S; const c = st && st.settings.sync; return c && c.on && c.token && c.owner && c.repo ? c : null; }
const SYNC_PATH = 'tawasol-vault.json';
async function gh(c, method, path, body, accept){
  const r = await fetch(GH + `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}` + path, {
    method, cache:'no-store', referrerPolicy:'no-referrer', credentials:'omit',
    headers: Object.assign({'Authorization':'Bearer ' + c.token, 'Accept': accept || 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}, body ? {'Content-Type':'application/json'} : {}),
    body: body ? JSON.stringify(body) : undefined

  return r;
}
async function ghJson(c, method, path, body){ const r = await gh(c, method, path, body); if (!r.ok){ const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; } return r.status === 204 ? null : r.json(); }
async function getBranch(c){
  if (SYNC.branch) return SYNC.branch;
  const j = await ghJson(c, 'GET', '');
  if (!j.private) throw Object.assign(new Error('public'), {status:'public'});
  return SYNC.branch = j.default_branch || 'main';
}
async function remoteHead(c){
  const br = await getBranch(c);
  const r = await gh(c, 'GET', `/git/ref/heads/${encodeURIComponent(br)}`);
  if (r.status === 404 || r.status === 409) return null; // empty repo
  if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), {status:r.status});
  return (await r.json()).object.sha;
}
async function remoteRead(c, commit){
  const r = await gh(c, 'GET', `/contents/${SYNC_PATH}?ref=${commit}`, null, 'application/vnd.github.raw+json');
  if (r.status === 404) return null;
  if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), {status:r.status});
  const t = (await r.text()).trim();
  return t ? JSON.parse(t) : null;
}
async function remoteWrite(c, vault, expectHead){
  const br = await getBranch(c);
  const content = b64e(te.encode(JSON.stringify(vault)));
  if (!expectHead){
    const j = await ghJson(c, 'PUT', `/contents/${SYNC_PATH}`, {message:'tawasol', content, branch:br});
    return j.commit.sha;
  }
  const head = await remoteHead(c);
  if (head !== expectHead) return false; // changed meanwhile: merge first
  const blob = await ghJson(c, 'POST', '/git/blobs', {content, encoding:'base64'});
  const tree = await ghJson(c, 'POST', '/git/trees', {tree:[{path:SYNC_PATH, mode:'100644', type:'blob', sha:blob.sha}]});
  const commit = await ghJson(c, 'POST', '/git/commits', {message:'tawasol', tree:tree.sha, parents:[]});
  await ghJson(c, 'PATCH', `/git/refs/heads/${encodeURIComponent(br)}`, {sha:commit.sha, force:true});
  return commit.sha;
}
const keyCache = {};
function cacheSess(){ if (SESS) keyCache[b64e(SESS.salt) + ':' + SESS.it] = SESS.K; }
function adoptRemote(o, v){
  // both devices end up using the same key, so later syncs need no password
  if (v.salt !== b64e(SESS.salt) || v.it !== SESS.it){ SESS = {K:o.sess.K, salt:o.sess.salt, it:o.sess.it, pw:o.sess.pw || SESS.pw}; cacheSess(); SYNC.rekeyed = true; persistSession(); }
  return o;
}
async function openRemoteVault(v){
  cacheSess();
  const sk = v.salt + ':' + v.it;
  if (keyCache[sk]){ try { return adoptRemote(await openVault(v, null, keyCache), v); } catch(e){} }
  if (SESS.pw){ try { return adoptRemote(await openVault(v, SESS.pw, keyCache), v); } catch(e){} }
  const pw = prompt('لإتمام المزامنة اكتب كلمة سر التطبيق (إن كانت مختلفة في الجهاز الآخر فاكتب كلمة سره):');
  if (!pw) throw Object.assign(new Error('pw'), {status:'pw'});
  const o = await openVault(v, pw, {});
  if (SESS.pw && pw !== SESS.pw) toast('أصبحت كلمة السر في هذا الجهاز هي نفسها كلمة سر الجهاز الآخر');

/* ================= session kept across app switching (IndexedDB) ================= */
function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open('ibnb_session', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbDo(mode, fn){ try { const db = await idbOpen(); return await new Promise((res, rej) => { const tx = db.transaction('kv', mode); const st = tx.objectStore('kv'); const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); } catch(e){ return null; } }
const idbGet = k => idbDo('readonly', st => st.get(k));
const idbSet = (k, v) => idbDo('readwrite', st => st.put(v, k));
const idbDel = k => idbDo('readwrite', st => st.delete(k));
let lastPersist = 0;
function persistSession(force){
  if (!unlocked || !SESS || !S) return;
  if (!force && Date.now() - lastPersist < 15000) return;
  lastPersist = Date.now();
  idbSet('s', {kt:SESS.K.t, k:SESS.K.k, salt:b64e(SESS.salt), it:SESS.it, last:lastAct, lockMin:S.settings.lockMin});
}
async function tryResume(){
  const ses = await idbGet('s'); const local = readLocalVault();
  if (!ses || !local) return false;
  if (Date.now() - ses.last > ses.lockMin * 60000 || local.salt !== ses.salt || local.it !== ses.it){ idbDel('s'); return false; }
  try {
    const K = {t:ses.kt, k:ses.k};
    let pt = await aesDec(K, b64d(local.iv), b64d(local.ct)); if (local.z) pt = await gunz(pt);
    S = upgrade(JSON.parse(td.decode(pt))); SESS = {K, salt:b64d(ses.salt), it:ses.it, pw:null};
    derivedVer++; D = null; SYNC.ref = null; SYNC.dirty = true;
    enterApp(); return true;
  } catch(e){ idbDel('s'); return false; }
}

    if (!confirm('توجد على هذا المتصفح معطيات محفوظة بكلمة سر مختلفة. هل تريد استبدالها بمعطيات هذا الملف؟')) throw new Error('cancel');

function filterStudents(){
  const d = derive();
  const toks = norm(ui.q).split(' ').filter(Boolean);
  const qd = ui.q.replace(/[^\d]/g, '');
  const res = [];
  for (const s of d.list){
    const x = d.idx.get(s.code);
    if (ui.cls && s.cls !== ui.cls) continue;
    if (ui.f.nophone && x.hp) continue;
    if (ui.f.noaddr && x.ha) continue;
    if (ui.f.flag && !s.flag.on) continue;
    if (ui.f.missing && !s.missing) continue;
    if (toks.length){
      const digitQ = qd.length >= 4 && qd.length === ui.q.replace(/\s/g, '').length;
      if (digitQ){ if (!x.p.includes(qd.replace(/^212/, '0'))) continue; }
      else if (!toks.every(t => x.t.includes(t))) continue;
    }
    let score = 0;
    if (toks.length){ const nm = x.n; if (nm.startsWith(toks[0])) score -= 3; if (toks.every(t => nm.includes(t))) score -= 2; }
    res.push({s, score});
  }
  res.sort((a, b) => a.score - b.score || 0);
  const arr = res.map(r => r.s);
  if (!toks.length) sortStudents(arr);
  return arr;
}

function bindSheet(s, tpl, sel){
  const root = $('#sheetRoot');
  $('#fPhone').onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    const nums = parsePhones(f.get('num'));
    if (!nums.length || !VALID.test(nums[0])) return toast('الرقم غير صالح. اكتب 10 أرقام تبدأ بـ 05 أو 06 أو 07.');
    if (contacts(s).some(c => c.num === nums[0])) return toast('هذا الرقم موجود من قبل.');
    s.extra.phones.push({id:uid(), num:nums[0], rel:f.get('rel'), note:clean(f.get('note'))});
    if (!hasPhoneBefore) s.primary = nums[0];
    touch(s); renderSheet(); toast('أضيف الرقم');
  };
  const hasPhoneBefore = hasPhone(s);
  $('#fAdr').onsubmit = e => { e.preventDefault(); s.extra.adr = clean(new FormData(e.target).get('adr')); touch(s); renderSheet(); toast('حُفظ العنوان'); };
  $('#flagOn').onchange = e => { s.flag.on = e.target.checked; touch(s); renderSheet(); };
  $('#flagNote').onchange = e => { s.flag.note = e.target.value.trim(); touch(s); toast('حُفظت الملاحظة'); };
  const updMsgLinks = () => { const t = $('#msgText').value; const p = primaryPhone(s); if (p && $('#sendWa')){ $('#sendWa').href = waLink(p.num, t); $('#sendSms').href = smsLink(p.num, t); } };
  $('#tplSel').onchange = e => { ui.sheetTpl = e.target.value; ui.msgText = null; renderSheet(); };
  $('#msgDate').onchange = e => { ui.msgDate = e.target.value; ui.msgText = null; renderSheet(); };
  $('#msgText').oninput = e => { ui.msgText = e.target.value; ui.msgFor = s.code + sel; updMsgLinks(); };
  $('#fConv').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target); printConvocation(s, f.get('d'), f.get('t'), f.get('r')); s.log.unshift({id:uid(), d:nowLocal(), ch:'استدعاء مكتوب', purpose:'استدعاء', res:'', num:'', u:Date.now(), by:devUser(), note:`استدعاء للحضور يوم ${fmtDate(f.get('d'))} ${f.get('t') || ''} — ${f.get('r')}`}); touch(s); renderSheet(); };
  $('#fLog').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target); s.log.unshift({id:uid(), d:f.get('d') || nowLocal(), ch:f.get('ch'), purpose:f.get('purpose'), res:f.get('res'), num:f.get('num'), note:clean(f.get('note')), u:Date.now(), by:devUser()}); s.log.sort((a, b) => b.d.localeCompare(a.d)); touch(s); renderSheet(); toast('سُجل التواصل'); };
  root.querySelector('.sheet').scrollTop = ui.sheetScroll || 0; ui.sheetScroll = 0;
}

  };

  $('#fHead').onchange = e => { if (e.target.name){ st[e.target.name] = e.target.value.trim(); touch(); toast('حُفظ'); } };
  $('#bfile').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await mergeFile(f); };
}
async function mergeFile(f){
  try {
    let txt = await f.text(); let v;
    if (/<html/i.test(txt)){ const mm = txt.match(/<script id="vault" type="text\/plain">([^<]*)<\/script>/); v = mm && mm[1].trim() ? JSON.parse(mm[1]) : null; }
    else v = JSON.parse(txt);
    if (!v || !v.ct) return toast('الملف لا يحتوي على نسخة صالحة');
    let opened;
    try { opened = await openVault(v, null, {[v.salt + ':' + v.it]: (b64e(SESS.salt) === v.salt && SESS.it === v.it) ? SESS.K : undefined}); }
    catch(e){ const pw = prompt('هذه النسخة بكلمة سر مختلفة. اكتب كلمة سرها:'); if (!pw) return; opened = await openVault(v, pw); }
    const mine = S.settings.sync; S = mergeStates(S, upgrade(opened.state)); upgrade(S); S.settings.sync = mine; touch(); await saveNow(); renderApp(); toast('تم دمج النسخة');
  } catch(e){ toast('تعذر فتح النسخة: كلمة السر غير صحيحة أو الملف تالف'); }
}

function chIcon(ch){ return ch === 'مكالمة' ? IC.phone : ch === 'واتساب' ? IC.wa : IC.sms; }
function resTag(l){ if (l.pending) return `<span class="tag amb">بانتظار النتيجة</span>`; return l.res ? `<span class="tag ${BAD_RES.test(l.res) ? 'red' : 'grn'}">${esc(l.res)}</span>` : ''; }
function logItemHTML(s, l){
  return `<div class="logi"><div class="t"><span class="tag cls">${esc(l.ch)}</span>${l.purpose ? `<span class="tag flag">${esc(l.purpose)}</span>` : ''}${resTag(l)}${l.num ? `<span class="phone" style="font-size:13px">${fmtPhone(l.num)}</span>` : ''}<span class="d">${l.by ? esc(l.by) + ' · ' : ''}${fmtDate(l.d)}</span>${l.pending ? `<button class="btn sm" data-complete="${esc(s.code)}|${l.id}">تسجيل النتيجة</button>` : ''}<button class="star" data-dellog="${l.id}" aria-label="حذف">${I(IC.trash, 15)}</button></div>${l.detail ? `<p>${esc(l.detail)}</p>` : ''}${l.note ? `<p><b>الملاحظات:</b> ${esc(l.note)}</p>` : ''}</div>`;
}
function userChoices(){ const st = S.settings; return [st.sign1 + ' ' + st.sign1Name, st.sign2 + ' ' + st.sign2Name].map(x => x.trim()).filter(Boolean); }
function openUserDlg(){ DLG = {type:'user'}; renderDlg(); }
function openCallDlg(code, num, ch){ if (!devUser()){ DLG = {type:'user', then:[code, num, ch]}; return renderDlg(); } DLG = {type:'call', code, num, ch, purpose:'', detail:''}; renderDlg(); }
function openResultDlg(code, id){ const s = S.students[code]; const l = s && s.log.find(x => x.id === id); if (!l) return; DLG = {type:'res', code, id, res:l.res && !l.pending ? l.res : '', note:l.note || ''}; renderDlg(); }
function renderDlg(){
  const root = document.getElementById('dlgRoot'); if (!DLG){ root.innerHTML = ''; return; }
  const s = DLG.type === 'user' ? null : S.students[DLG.code]; if (DLG.type !== 'user' && !s){ closeDlg(); return; }
  let body = '';
  if (DLG.type === 'user'){
    root.innerHTML = `<div class="dscrim" data-dlg="cancel"></div><div class="card dlg" role="dialog" aria-modal="true"><h3>${I(IC.users, 20)} من يستعمل هذا الجهاز؟</h3><div class="dsub">يُكتب الاسم مع كل اتصال في سجل التواصل. يمكن تغييره من الإعدادات.</div>
      <span class="l">اختر</span><div class="chips">${userChoices().map(u => `<button class="chip" data-setuser="${esc(u)}">${esc(u)}</button>`).join('')}</div>
      <span class="l">أو اكتب اسما آخر</span><input class="field" id="dUser" placeholder="الاسم والصفة">
      <div class="acts2"><button class="btn" data-dlg="saveuser">${I(IC.check, 18)} متابعة</button></div></div>`;
    return;
  }
  if (DLG.type === 'call'){
    const cs = contacts(s).filter(c => c.valid);
    body = `<h3>${I(chIcon(DLG.ch), 20)} التواصل مع ولي أمر ${esc(sName(s))}</h3><div class="dsub"><span dir="ltr">${esc(s.cls)}</span></div>
      <span class="l">الرقم</span><div class="chips">${cs.map(c => `<button class="chip ${c.num === DLG.num ? 'on' : ''}" data-dnum="${c.num}"><span class="phone" style="color:inherit">${fmtPhone(c.num)}</span> · ${esc(c.rels.join(' / '))}</button>`).join('')}</div>
      <span class="l">طريقة التواصل</span><div class="chips">${['مكالمة', 'واتساب', 'رسالة نصية'].map(c => `<button class="chip ${c === DLG.ch ? 'on' : ''}" data-dch="${c}">${I(chIcon(c), 14)} ${c}</button>`).join('')}</div>
      <span class="l">الهدف من التواصل</span><div class="chips">${PURPOSES.map(c => `<button class="chip ${c === DLG.purpose ? 'on' : ''}" data-dpp="${c}">${c}</button>`).join('')}</div>
      <span class="l">تفاصيل (اختياري)</span><input class="field" id="dDetail" value="${esc(DLG.detail)}" placeholder="مثلا: غياب يومي الإثنين والثلاثاء">
      <div class="acts2"><button class="btn ${DLG.ch === 'واتساب' ? 'wa' : ''}" data-dlg="go">${I(chIcon(DLG.ch), 18)} ${chLabel(DLG.ch)}</button><button class="btn ghost" data-dlg="cancel">إلغاء</button></div>`;
  } else {
    const l = s.log.find(x => x.id === DLG.id); if (!l){ closeDlg(); return; }
    const opts = l.ch === 'مكالمة' ? CALL_RES : MSG_RES;
    body = `<h3>${I(IC.log, 20)} نتيجة التواصل مع ولي أمر ${esc(sName(s))}</h3>
      <div class="dsub">${esc(l.ch)}${l.purpose ? ' · ' + esc(l.purpose) : ''}${l.num ? ` · <span class="phone" style="font-weight:500;color:inherit">${fmtPhone(l.num)}</span>` : ''} · ${fmtDate(l.d)}</div>
      ${l.detail ? `<div class="dsub">${esc(l.detail)}</div>` : ''}
      <span class="l">ماذا حدث؟</span><div class="chips">${opts.map(c => `<button class="chip ${c === DLG.res ? 'on' : ''}" data-drr="${c}">${c}</button>`).join('')}</div>
      <span class="l">الملاحظات</span><textarea class="field" id="dNote" placeholder="ماذا قال ولي الأمر؟ ما الذي اتُّفق عليه؟">${esc(DLG.note)}</textarea>
      <div class="acts2"><button class="btn" data-dlg="save">${I(IC.check, 18)} حفظ</button><button class="btn ghost" data-dlg="later">لاحقا</button></div>`;
  }
  root.innerHTML = `<div class="dscrim" data-dlg="${DLG.type === 'call' ? 'cancel' : 'later'}"></div><div class="card dlg" role="dialog" aria-modal="true">${body}</div>`;
  const dd = document.getElementById('dDetail'); if (dd) dd.oninput = e => DLG.detail = e.target.value;
  const dn = document.getElementById('dNote'); if (dn) dn.oninput = e => DLG.note = e.target.value;
}
function openExternal(url){ const a = document.createElement('a'); a.href = url; if (/^https:/.test(url)){ a.target = '_blank'; a.rel = 'noopener noreferrer'; } document.body.appendChild(a); a.click(); a.remove(); }
function dlgClick(ds){
  if (!DLG) return;
  if (ds.dnum){ DLG.num = ds.dnum; return renderDlg(); }
  if (ds.dch){ DLG.ch = ds.dch; return renderDlg(); }
  if (ds.dpp){ DLG.purpose = ds.dpp; return renderDlg(); }
  if (ds.drr){ DLG.res = ds.drr; return renderDlg(); }
  if (ds.dlg === 'saveuser'){ const v = clean((document.getElementById('dUser') || {}).value); if (!v) return toast('اختر اسما أو اكتبه'); setDevUser(v); const th = DLG.then; closeDlg(); if (th) openCallDlg(...th); return; }
  const s = S.students[DLG.code];
  if (ds.dlg === 'cancel' || ds.dlg === 'later'){ ui.await = null; closeDlg(); return; }
  if (ds.dlg === 'go'){
    if (!DLG.purpose) return toast('اختر الهدف من التواصل');
    const l = {id:uid(), d:nowLocal(), ch:DLG.ch, purpose:DLG.purpose, detail:clean(DLG.detail), num:DLG.num, res:'', note:'', pending:true, u:Date.now(), by:devUser()};
    s.log.unshift(l); touch(s);
    ui.await = {code:s.code, id:l.id};
    const url = DLG.ch === 'مكالمة' ? 'tel:' + DLG.num : DLG.ch === 'واتساب' ? waLink(DLG.num, '') : smsLink(DLG.num, '');
    closeDlg();
    openExternal(url);
    saveNow(); persistSession(true);
    if (ui.open === s.code){ keepScroll(); renderSheet(); }
    setTimeout(() => { if (!document.hidden) maybeAskResult(); }, 2500);
    return;
  }
  if (ds.dlg === 'save'){
    if (!DLG.res) return toast('اختر ما حدث في التواصل');
    const l = s.log.find(x => x.id === DLG.id);
    if (l){ l.res = DLG.res; l.note = clean(DLG.note); l.pending = false; l.u = Date.now(); if (!l.by) l.by = devUser(); touch(s); }
    ui.await = null; closeDlg(); toast('سُجلت النتيجة في سجل التواصل');
    if (ui.open === s.code){ keepScroll(); renderSheet(); } else renderView();
    refreshBadges();
  }
}
function maybeAskResult(onEnter){
  if (!unlocked || DLG) return;
  let target = null;
  if (ui.await){ const s = S.students[ui.await.code]; const l = s && s.log.find(x => x.id === ui.await.id); if (l && l.pending) target = ui.await; else ui.await = null; }
  if (!target && onEnter){
    const p = allLogs().filter(x => x.l.pending && Date.now() - new Date(x.l.d).getTime() < 12 * 3600000)[0];
    if (p) target = {code:p.s.code, id:p.l.id};
  }
  if (target) openResultDlg(target.code, target.id);
}

/* ================= global events ================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-setuser],[data-dlg],[data-dnum],[data-dch],[data-dpp],[data-drr],[data-callask],[data-msglog],[data-complete],[data-nav],[data-act],[data-open],[data-f],[data-primary],[data-delphone],[data-reason],[data-dellog],[data-showcls],[data-copycls],[data-printcls],[data-mk],[data-saverow],[data-deltpl]');
  if (!t || !unlocked) return;
  const ds = t.dataset;
  if (ds.nav){ closeSheetQuiet(); go(ds.nav); return; }
  if (ds.open){ e.preventDefault(); ui.sheetScroll = 0; openStudent(ds.open); return; }
  if (ds.f){ ui.f[ds.f] = !ui.f[ds.f]; t.classList.toggle('on', ui.f[ds.f]); ui.limit = 60; renderResults(); return; }
  if (ds.setuser != null){ setDevUser(ds.setuser); if (DLG && DLG.type === 'user'){ const th = DLG.then; closeDlg(); if (th) openCallDlg(...th); else toast('حُفظ'); } else { renderView(); toast('حُفظ'); } return; }
  if (ds.dlg || ds.dnum || ds.dch || ds.dpp || ds.drr){ dlgClick(ds); return; }
  if (ds.callask){ e.stopPropagation(); const [code, num, ch] = ds.callask.split('|'); openCallDlg(code, num, ch); return; }
  if (ds.complete){ const [code, id] = ds.complete.split('|'); openResultDlg(code, id); return; }
  if (ds.msglog){ const [code, num, ch] = ds.msglog.split('|'); const st = S.students[code]; const tp = S.settings.templates.find(x => x.id === (ui.sheetTpl || S.settings.templates[0]?.id)); st.log.unshift({id:uid(), d:nowLocal(), ch, purpose:tp ? tp.title : '', res:'تم الإرسال', num, note:'', u:Date.now(), by:devUser()}); touch(st); setTimeout(() => { keepScroll(); renderSheet(); }, 300); return; }
  if (ds.primary){ const s = S.students[ui.open]; s.primary = ds.primary; touch(s); keepScroll(); renderSheet(); return; }
  if (ds.delphone){ const s = S.students[ui.open]; if (!confirm('حذف هذا الرقم؟')) return; s.extra.phones = s.extra.phones.filter(p => p.id !== ds.delphone); (s.del = s.del || []).push(ds.delphone); touch(s); keepScroll(); renderSheet(); return; }
  if (ds.reason){ const s = S.students[ui.open]; const r = ds.reason; s.flag.reasons = s.flag.reasons.includes(r) ? s.flag.reasons.filter(x => x !== r) : [...s.flag.reasons, r]; touch(s); keepScroll(); renderSheet(); return; }
  if (ds.dellog){ const s = S.students[ui.open]; if (!confirm('حذف هذا السطر من السجل؟')) return; s.log = s.log.filter(l => l.id !== ds.dellog); (s.del = s.del || []).push(ds.dellog); touch(s); keepScroll(); renderSheet(); return; }
  if (ds.showcls){ ui.cls = ds.showcls; ui.q = ''; ui.f = {nophone:false, noaddr:false, flag:false, missing:false}; go('search'); return; }
  if (ds.copycls != null){ const d = derive(); const arr = sortStudents(d.list.filter(s => s.cls === ds.copycls)).map(s => primaryPhone(s)).filter(Boolean).map(p => p.num); const ok = await copyText([...new Set(arr)].join('\n')); toast(ok ? `نُسخ ${new Set(arr).size} رقم` : 'تعذر النسخ'); return; }
  if (ds.printcls != null){ printMissing(ds.printcls); return; }
  if (ds.mk){ ui.mkind = ds.mk; renderView(); return; }
  if (ds.saverow){
    const s = S.students[ds.saverow]; const tr = t.closest('tr'); let changed = false;
    const ni = tr.querySelector('[name=num]'), ai = tr.querySelector('[name=adr]');
    if (ni && ni.value.trim()){ const n = parsePhones(ni.value)[0]; if (!n || !VALID.test(n)) return toast('الرقم غير صالح'); s.extra.phones.push({id:uid(), num:n, rel:tr.querySelector('[name=rel]').value, note:''}); if (!s.primary) s.primary = n; changed = true; }
    if (ai && ai.value.trim()){ s.extra.adr = clean(ai.value); changed = true; }
    if (!changed) return toast('اكتب الرقم أو العنوان أولا');
    touch(s); toast('حُفظ'); tr.style.opacity = '.4'; setTimeout(() => { renderView(); refreshBadges(); }, 400); return;
  }
  if (ds.deltpl){ if (!confirm('حذف هذا النموذج؟')) return; S.settings.templates = S.settings.templates.filter(x => x.id !== ds.deltpl); touch(); renderView(); return; }
  switch (ds.act){
    case 'lock': lock(); break;
    case 'close': closeSheet(); break;
    case 'more': ui.limit += 100; renderResults(); break;
    case 'copymsg': { const ok = await copyText($('#msgText').value); toast(ok ? 'نُسخت الرسالة' : 'تعذر النسخ'); break; }
    case 'exportapp': exportApp(); break;
    case 'install': if (installEvt){ installEvt.prompt(); installEvt = null; t.classList.add('hidden'); } break;
    case 'backup': backup(); break;
    case 'syncnow': SYNC.ref = null; syncNow(true); break;
    case 'syncoff': if (confirm('إيقاف المزامنة في هذا الجهاز؟ المعطيات تبقى كما هي.')){ S.settings.sync = Object.assign({}, S.settings.sync, {on:false}); SYNC.status = 'off'; touch(); renderView(); paintSync(); } break;
    case 'exportxlsx': exportXlsx(); break;
    case 'exportlog': exportLogXlsx(); break;
    case 'addtpl': S.settings.templates.push({id:uid(), title:'نموذج جديد', body:'السلام عليكم،\n… {التلميذ} … {القسم} …\n{المؤسسة}'}); touch(); renderView(); break;
    case 'wipe': {
      const w = prompt('اكتب كلمة «حذف» لتأكيد مسح كل المعطيات من هذا المتصفح:');
      if (w && w.trim() === 'حذف'){ try { localStorage.removeItem(LS_KEY); } catch(_){} idbDel('s'); unlocked = false; S = null; SESS = null; $('#app').innerHTML = ''; $('#app').classList.add('hidden'); $('#lock').classList.remove('hidden'); renderLock(EMBEDDED ? 'unlock' : 'setup'); }
      break;
    }
  }
});
function keepScroll(){ const sh = document.querySelector('.sheet'); ui.sheetScroll = sh ? sh.scrollTop : 0; }
function closeSheetQuiet(){ ui.open = null; $('#sheetRoot').innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (DLG){ ui.await = null; closeDlg(); } else if (ui.open) closeSheet(); } });

/* ================= boot ================= */
if (!HAS_SUBTLE && !window.NobleCrypto){ $('#lock').innerHTML = '<div class="lockbox"><b>هذا المتصفح لا يدعم التشفير. استعمل Chrome أو Edge أو Firefox.</b></div>'; }
else tryResume().then(ok => { if (!ok) renderLock(readLocalVault() || EMBEDDED ? 'unlock' : pendingJoin() ? 'join' : 'setup'); });
